name: Tag release

# Tags a release when a version bump in package.json lands on main,
# then starts the release workflow for the tag.
on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # A rerun of this workflow finds its own tag; release it again.
            # Other package.json changes, such as dependency updates, find an older tag.
            if [ "$(git rev-parse "$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "$TAG already exists on an earlier commit; nothing to release"
              exit 0
            fi
          else
            LATEST="$(git tag --list 'v[0-9]*' | sort -V | tail -n 1)"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
              [ "$(printf '%s\n' "$LATEST" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
              echo "::error::Version $VERSION must be of the form M.N.P and newer than $LATEST"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Version $VERSION" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          # Tags pushed with GITHUB_TOKEN don't trigger workflows,
          # so start the release workflow for the tag explicitly.
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"
