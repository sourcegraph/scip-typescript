name: release

on:
  push:
    tags:
      - v*
    branches:
      - main
  # tag-release.yml starts this workflow for release tags, because tags
  # pushed with GITHUB_TOKEN don't trigger the push event above.
  workflow_dispatch:

jobs:
  release-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: du -h dist/src/main.js
      - name: Check for a newer release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Rerunning an older release would move the latest and minor/major
          # Docker tags back to it.
          NEWEST="$(git ls-remote --tags --refs origin 'v[0-9]*' | sed 's|.*refs/tags/||' | sort -V | tail -n 1)"
          if [ "$NEWEST" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$NEWEST is newer than $GITHUB_REF_NAME; not releasing $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # A rerun after a failed Docker push finds the version already published.
          if npm view "@sourcegraph/scip-typescript@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "@sourcegraph/scip-typescript@${GITHUB_REF_NAME#v} is already published"
          else
            npm publish --access public
          fi
      - run: echo "PATCH=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
      - run: echo "MINOR=${PATCH%.*}" >> $GITHUB_ENV
      - run: echo "MAJOR=${MINOR%.*}" >> $GITHUB_ENV
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push snapshot
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: |
            sourcegraph/scip-typescript:latest-snapshot
      - name: Build and push tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: |
            sourcegraph/scip-typescript:latest
            sourcegraph/scip-typescript:${{ env.PATCH }}
            sourcegraph/scip-typescript:${{ env.MINOR }}
            sourcegraph/scip-typescript:${{ env.MAJOR }}

  # A separate job, so the job that installs dependencies can't write to the repository.
  github-release:
    needs: release-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
